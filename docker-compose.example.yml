services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=backend:3000
    volumes:
      - ./frontend:/app-f # Sync local frontend directory with container
      - /app-f/node_modules # Exclude node_modules to avoid conflicts
    depends_on:
      - backend
    networks:
      - app-network
    command: yarn dev

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=<>
      - JWT_SECRET=<>
      - REDIS_DB_URI=redis-stack:6379
      - REDIS_DB_PASSWORD= # Ensure this is intentional or provide a value
      - REDIS_DB=0
    volumes:
      - ./backend:/app # Sync local backend directory with container
      - go-modules:/go/pkg/mod
    networks:
      - app-network
    command: air -c .air.toml

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379" 
      - "8001:8001"
    volumes:
      - redis-stack-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"] # Ensure redis-cli is available in the image
      interval: 5s
      timeout: 3s
      retries: 3

  socket:
    build: ./socket
    ports:
      - "4000:4000"
    networks:
      - app-network

volumes:
  go-modules:
    name: lamur-go-modules
  redis-stack-data:
    name: lamur-redis-stack-data

networks:
  app-network:
    driver: bridge